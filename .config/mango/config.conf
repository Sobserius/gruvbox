# MangoWC config — Gruvbox rice adapted from xylvzm/dotfiles-archlinux (Hyprland)
# https://github.com/xylvzm/dotfiles-archlinux
# Docs: https://mangowm.github.io/docs/

# --- Variables ---
var=term,kitty
var=fileManager,dolphin
var=menu,$HOME/.config/rofi/launch-gruvbox.sh
var=wallpaper,$HOME/lowpoly.png

# --- Environment ---
env=XCURSOR_SIZE,24

# --- Autostart (replaces Hyprland rice-startup.sh / hyprland.start hook) ---
exec_once=sh $HOME/.config/mango/rice-startup.sh

# --- Look & feel (Gruvbox) ---
# Original Hyprland: gaps_in=5, gaps_out=20, border 2, rounding 10
# Active/inactive gradient (#8c3936 -> #ba9f64) approximated via focus/border colors.
border_px=2
border_radius=10
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=20
gap_outer_vertical=20

# Mango uses single 0xRRGGBBAA colors (no gradient border in this conf form)
focus_color=0xba9f64ff
border_color=0x8c3936ff
urgent_color=0x8c3936ff
root_color=0x000200ff

# Blur/shadow (approximation of original Hyprland decoration)
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=1
blur_params_radius=3
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.17

shadows=1
layer_shadows=0
shadow_only_floating=1
shadows_size=4
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadows_color=0x1a1a1aee

# --- Animations (enabled; tuned as a reasonable approximation) ---
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=450
animation_duration_focus=0
animation_curve_open=0.23,1.0,0.32,1
animation_curve_move=0.23,1.0,0.32,1
animation_curve_tag=0.23,1.0,0.32,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# --- Layouts ---
# Original: dwindle with preserve_split=true
tag_num=10
default_master_factor=0.55
default_master_count=1
new_is_master=0
smart_gaps=0

dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=1
dwindle_smart_resize=0
dwindle_drop_simple_split=1
dwindle_manual_split=0

# --- Input ---
xkb_rules_layout=us,ru
repeat_rate=25
repeat_delay=600
numlock_on=0

# Toggle EN/RU with Alt+Shift
bind=ALT,Shift_L,switch_keyboard_layout
bind=ALT,Shift_R,switch_keyboard_layout

sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
cursor_size=24

tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
mouse_natural_scrolling=0

# 3-finger horizontal workspace swipe (original Hyprland gesture)
gesturebind=none,left,3,viewtoright
gesturebind=none,right,3,viewtoleft

# --- Key bindings (SUPER = mainMod) ---
bind=SUPER,q,spawn,$term
bind=SUPER,c,killclient
bind=SUPER,m,quit
bind=SUPER,e,spawn,$fileManager
bind=SUPER,v,togglefloating
bind=SUPER,r,spawn,$menu
bind=SUPER,j,dwindle_toggle_current_split

# Focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Move windows
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down

# Tags (workspaces) 1-10
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,10

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,10

# Special workspace / scratchpad (Hyprland "magic")
bind=SUPER,s,toggle_special_tag

# Screenshot & recording (adapted for MangoWC)
bind=,Print,spawn,sh $HOME/.config/mango/scripts/screenshot.sh full
bind=ALT,Print,spawn,sh $HOME/.config/mango/scripts/screenshot.sh region
bind=SUPER+SHIFT,s,spawn,sh $HOME/.config/mango/scripts/screenshot.sh region
bind=SUPER+SHIFT,F9,spawn,python3 $HOME/.config/mango/scripts/record-screen.py

# Cycle tags (original: Super+scroll / Super+PageUp/Down => e-1/e+1)
bind=SUPER,Page_Up,viewtoleft_have_client
bind=SUPER,Page_Down,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Mouse move/resize
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Media / brightness (wpctl + playerctl + brightnessctl)
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
# bind=NONE,XF86AudioPause,spawn,playerctl play-pause  # uncomment if your keyboard sends Pause (may conflict with Play)
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# Reload config
bind=SUPER+SHIFT,r,reload_config

# --- Window rules (Hyprland equivalents, best-effort) ---
# Ignore maximize requests from all apps
window_rule=ignore_maximize:1,app_id:.*
window_rule=ignore_maximize:1,title:.*
